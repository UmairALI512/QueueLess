{% extends "base.html" %}{% block title %}Register Clinic{% endblock %}{% block content %}<section class="formbox"><small>JOIN QUEUELESS</small><h1>Register your clinic</h1>{% if error %}<p class="error">{{error}}</p>{% endif %}<form method="post" class="fields"><label>Clinic name<input name="clinic_name" required></label><label>City<input name="city" placeholder="Nawabshah"></label><label>Phone<input name="phone"></label><label>Owner / admin name<input name="owner" required></label><label>Email<input name="email" type="email" required></label><label>Password (minimum 10 characters)<input name="password" type="password" minlength="10" required></label><button class="btn">Create account</button></form><p>Already registered? <a href="/login">Log in</a></p></section>{% endblock %}
